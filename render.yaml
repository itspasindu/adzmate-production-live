# Render Blueprint — AdzMate API
# Dashboard: New → Blueprint → connect this repo
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: adzmate-api
    runtime: python
    plan: free
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: ENVIRONMENT
        value: "production"
      - key: AUTH_ENABLED
        value: "true"
      - key: ADZMATE_ALLOW_DEMO
        value: "0"
      - key: ADZMATE_USE_LLM
        value: "0"
      - key: ADZMATE_USE_AI_IMAGES
        value: "0"
      - key: STORAGE_BACKEND
        value: "local"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: WEB_APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADZMATE_USE_FIXTURE_METRICS
        value: "0"
    disk:
      name: adzmate-data
      mountPath: /var/data
      sizeGB: 1

  - type: worker
    name: adzmate-worker
    runtime: python
    plan: free
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: arq app.jobs.worker.WorkerSettings
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: ENVIRONMENT
        value: "production"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ADZMATE_USE_FIXTURE_METRICS
        value: "0"
