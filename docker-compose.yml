services:
  api:
    image: python:3.12-slim
    working_dir: /app/apps/api
    volumes:
      - ./:/app
    command: bash -c "pip install -r requirements.txt && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
  web:
    image: node:22-alpine
    working_dir: /app/apps/web
    volumes:
      - ./:/app
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0"
    environment:
      - API_INTERNAL_URL=http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
